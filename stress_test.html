<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ストレス評価 テストページ</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 760px; }
  video { width: 320px; max-width: 100%; background: #000; }
  #score { font-size: 3rem; font-weight: bold; }
  #alert { display: inline-block; padding: 2px 10px; border-radius: 4px; background: #ddd; }
  #alert.on { background: #d33; color: #fff; }
  canvas { width: 100%; height: 160px; border: 1px solid #aaa; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  label { margin-right: 8px; }
</style>
</head>
<body>
<h1>ストレス評価 テストページ</h1>
<p>このPCのWebカメラ映像をサーバーへ送り、実ロボットの代わりに評価結果を確認します。</p>
<p>
  <label>FPS <input id="fps" type="number" value="5" min="1" max="15" style="width:4em"></label>
  <label>トークン <input id="token" type="password" placeholder="未設定なら空"></label>
  <button id="btn">開始</button>
</p>
<div class="row">
  <video id="v" autoplay muted playsinline></video>
  <div>
    <div id="score">--</div>
    <div>ID: <span id="fid">-</span> / アラート: <span id="alert">OFF</span></div>
    <div id="msg">停止中</div>
  </div>
</div>
<canvas id="c" width="720" height="160"></canvas>
<script>
const $ = id => document.getElementById(id);
const hist = [];
let running = false;

function draw() {
  const c = $("c"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  g.strokeStyle = "#ccc";
  for (const y of [33, 66]) { const py = c.height * (1 - y / 100); g.beginPath(); g.moveTo(0, py); g.lineTo(c.width, py); g.stroke(); }
  g.strokeStyle = "#06c"; g.beginPath();
  hist.forEach((s, i) => {
    const x = c.width * i / 300, y = c.height * (1 - (s ?? 0) / 100);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

async function loop() {
  const v = $("v"), cv = document.createElement("canvas");
  while (running) {
    const t0 = performance.now();
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    cv.getContext("2d").drawImage(v, 0, 0);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.8));
    try {
      const h = { "X-Timestamp": String(Date.now() / 1000) };
      if ($("token").value) h["X-Token"] = $("token").value;
      const res = await fetch("/", { method: "POST", body: blob, headers: h });
      const j = await res.json();
      if (!res.ok) { $("msg").textContent = `エラー ${res.status}: ${j.error}`; }
      else {
        $("msg").textContent = j.score == null ? "顔なし / ベースライン学習中" : "評価中";
        $("score").textContent = j.score == null ? "--" : j.score.toFixed(1);
        $("fid").textContent = j.face_id ?? "-";
        $("alert").textContent = j.alert ? "ON" : "OFF";
        $("alert").className = j.alert ? "on" : "";
        hist.push(j.score); if (hist.length > 300) hist.shift(); draw();
      }
    } catch (e) { $("msg").textContent = "通信エラー: " + e; }
    const wait = 1000 / Number($("fps").value || 5) - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
}

$("btn").onclick = async () => {
  if (running) { running = false; $("btn").textContent = "開始"; return; }
  try {
    $("v").srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
  } catch (e) { $("msg").textContent = "カメラを開けません（localhost か https で開く必要があります）: " + e; return; }
  await new Promise(r => $("v").onloadedmetadata = r);
  running = true; $("btn").textContent = "停止"; loop();
};
</script>
</body>
</html>
